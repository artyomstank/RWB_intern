name: trending

services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: trending-kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000

    ports:
      - "9094:9094"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  trending:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trending-service

    environment:
      TRENDING_HTTP_ADDR: ":8080"
      TRENDING_KAFKA_BROKERS: "kafka:9092"
      TRENDING_KAFKA_TOPIC: "search.events"
      TRENDING_KAFKA_GROUP: "trending-v1"
      TRENDING_STOPLIST_DB: "/data/stoplist.db"
      TRENDING_TOPN_SIZE: "10"
      TRENDING_TOPN_REFRESH: "2s"

    ports:
      - "8080:8080"

    volumes:
      - trending-data:/data

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: trending-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h

    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      trending:
        condition: service_healthy

    profiles:
      - monitoring


volumes:
  kafka-data:
  trending-data: